services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: .
    restart: unless-stopped
    command: uvicorn src.app:app --host 0.0.0.0 --port 8010
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./indices:/app/indices
    ports:
      - "8010:8010"
    depends_on:
      - redis

  worker:
    build: .
    restart: unless-stopped
    command: rq worker -u redis://redis:6379/0 tiny_coffee_tasks
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./indices:/app/indices
    depends_on:
      - redis

